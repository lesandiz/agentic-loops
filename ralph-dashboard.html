<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ralph Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #d18616;
    --blue: #58a6ff;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .state-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .state-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .state-idle .dot { background: var(--text-dim); }
  .state-running .dot { background: var(--green); animation: pulse 1.5s infinite; }
  .state-stopping .dot { background: var(--orange); animation: pulse 0.5s infinite; }
  .state-stopped .dot { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Log panel */
  .log-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  .log-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .filter-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.1); }

  .log-container {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.6;
    position: relative;
  }
  .log-entry {
    white-space: pre-wrap;
    word-break: break-word;
    padding: 1px 0;
  }
  .log-entry .ts { color: var(--text-dim); }
  .log-entry .iter { color: var(--purple); }
  .log-entry.level-tool .prefix { color: var(--blue); }
  .log-entry.level-error .prefix { color: var(--red); }
  .log-entry.level-steer .prefix { color: var(--orange); }
  .log-entry.level-system .prefix { color: var(--text-dim); }
  .log-entry.level-agent .prefix { color: var(--green); }
  .log-entry.level-info .prefix { color: var(--text); }

  .jump-btn {
    position: absolute;
    bottom: 12px;
    right: 20px;
    padding: 6px 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    display: none;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .jump-btn:hover { opacity: 0.9; }

  /* Side panel */
  .side-panel {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow-y: auto;
  }
  .side-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .side-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 13px;
  }
  .stat-label { color: var(--text-dim); }
  .stat-value { color: var(--text); font-weight: 500; }

  .tool-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  .tool-tag {
    padding: 2px 8px;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 4px;
    font-size: 11px;
    color: var(--blue);
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .ctrl-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.05); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .ctrl-btn.danger { border-color: var(--red); color: var(--red); }
  .ctrl-btn.danger:hover { background: rgba(248,81,73,0.1); }
  .ctrl-btn.primary { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.primary:hover { background: rgba(88,166,255,0.1); }

  /* Steering */
  .steer-textarea {
    width: 100%;
    min-height: 60px;
    max-height: 120px;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  .steer-textarea:focus { border-color: var(--accent); }
  .steer-textarea::placeholder { color: var(--text-dim); }
  .steer-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .steer-hint { font-size: 10px; color: var(--text-dim); }

  /* Footer */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .conn-status {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .conn-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
  }
  .conn-dot.disconnected { background: var(--red); }

  /* Collapsible sections */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .section-header h3 { margin-bottom: 0; }
  .section-arrow {
    font-size: 12px;
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .section-arrow.collapsed { transform: rotate(-90deg); }
  .section-body { margin-top: 10px; }
  .section-body.hidden { display: none; }
  #tokenChart { width: 100%; height: 180px; display: block; }
  .chart-tooltip {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    pointer-events: none;
    display: none;
    z-index: 100;
    white-space: nowrap;
    color: var(--text);
  }

  /* Budget colors */
  .budget-warn { color: var(--yellow) !important; }
  .budget-danger { color: var(--red) !important; }

  /* Sidebar toggle (hidden on desktop) */
  .sidebar-toggle {
    display: none;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .sidebar-toggle:hover { background: rgba(255,255,255,0.05); }

  /* Resize handle */
  .resize-handle {
    width: 5px;
    cursor: col-resize;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .resize-handle:hover,
  .resize-handle.active {
    background: var(--accent);
  }

  /* Responsive: tablet / narrow */
  @media (max-width: 768px) {
    .sidebar-toggle { display: inline-block; }
    .main { flex-direction: column; }
    .log-panel {
      border-right: none;
      border-bottom: 1px solid var(--border);
      min-height: 40vh;
    }
    .resize-handle { display: none; }
    .side-panel {
      width: 100% !important;
      display: none;
      max-height: 50vh;
      overflow-y: auto;
    }
    .side-panel.visible { display: flex; flex-direction: column; }
    .header { padding: 8px 12px; }
    .header h1 { font-size: 14px; }
    .log-toolbar { overflow-x: auto; flex-wrap: nowrap; }
    .filter-btn { flex-shrink: 0; }
    .side-section { padding: 12px; }
    .stat-row { font-size: 12px; }
    .footer { padding: 4px 12px; font-size: 10px; }
  }

  /* Model input */
  .model-input {
    flex: 1;
    padding: 4px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
    font-family: inherit;
    outline: none;
    min-width: 0;
  }
  .model-input:focus { border-color: var(--accent); }
  .model-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 6px;
  }
  .model-preset {
    padding: 2px 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
    font-family: inherit;
    color: var(--text-dim);
    cursor: pointer;
  }
  .model-preset:hover { border-color: var(--accent); color: var(--accent); }

  /* Custom scrollbar */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(139,148,158,0.3) transparent;
  }
  *::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  *::-webkit-scrollbar-track {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    background: rgba(139,148,158,0.25);
    border-radius: 3px;
  }
  *::-webkit-scrollbar-thumb:hover {
    background: rgba(139,148,158,0.5);
  }
  *::-webkit-scrollbar-corner {
    background: transparent;
  }

  /* Responsive: phone */
  @media (max-width: 480px) {
    .header h1 { font-size: 12px; }
    .state-badge { font-size: 10px; padding: 3px 8px; }
    .log-container { font-size: 11px; padding: 6px 8px; }
    .side-section { padding: 8px; }
    .side-section h3 { font-size: 10px; }
    .stat-row { font-size: 11px; }
    .ctrl-btn { font-size: 11px; padding: 6px; }
    #tokenChart { height: 140px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Ralph Dashboard</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="sidebar-toggle" onclick="toggleSidebar()">Panel</button>
    <div id="stateBadge" class="state-badge state-idle">
      <span class="dot"></span>
      <span id="stateText">idle</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="log-panel">
    <div class="log-toolbar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="tool">Tools</button>
      <button class="filter-btn" data-filter="agent">Agent</button>
      <button class="filter-btn" data-filter="steer">Steering</button>
      <button class="filter-btn" data-filter="system">System</button>
      <button class="filter-btn" data-filter="error">Errors</button>
      <span style="flex:1"></span>
      <button class="filter-btn" onclick="clearLogs()" title="Clear log display">Clear</button>
    </div>
    <div class="log-container" id="logContainer">
      <div class="log-entry level-system"><span class="prefix">Waiting for connection...</span></div>
    </div>
    <button class="jump-btn" id="jumpBtn" onclick="jumpToBottom()">Jump to bottom</button>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>
  <div class="side-panel" id="sidePanel">
    <div class="side-section">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>Progress</h3>
        <span class="section-arrow collapsed">&#9660;</span>
      </div>
      <div class="section-body hidden">
        <div class="stat-row">
          <span class="stat-label">Iteration</span>
          <span><span class="stat-value" id="iterCurrent">0</span>/<span class="stat-value" id="iterMax">-</span></span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Elapsed</span>
          <span class="stat-value" id="elapsed">00:00:00</span>
        </div>
      </div>
    </div>

    <div class="side-section">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>Model</h3>
        <span class="section-arrow collapsed">&#9660;</span>
      </div>
      <div class="section-body hidden">
        <div style="display:flex;gap:4px">
          <input type="text" id="modelInput" class="model-input" value="" placeholder="model name">
          <button class="ctrl-btn primary" style="flex:0;padding:4px 10px;font-size:11px" onclick="doModelChange()">Set</button>
        </div>
        <div class="model-presets">
          <button class="model-preset" onclick="setModel('claude-haiku-4-5@20251001')">haiku-4.5</button>
          <button class="model-preset" onclick="setModel('claude-sonnet-4-6@default')">sonnet-4.6</button>
          <button class="model-preset" onclick="setModel('claude-opus-4-6@default')">opus-4.6</button>
        </div>
      </div>
    </div>

    <div class="side-section">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>Token Usage</h3>
        <span class="section-arrow collapsed">&#9660;</span>
      </div>
      <div class="section-body hidden">
        <div class="stat-row">
          <span class="stat-label">Input</span>
          <span class="stat-value" id="tokInput">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Output</span>
          <span class="stat-value" id="tokOutput">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="tokTotal">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Cost</span>
          <span class="stat-value" id="costUsd">$0.00</span>
        </div>
        <div class="stat-row" id="budgetRow" style="display:none">
          <span class="stat-label">Budget</span>
          <span class="stat-value" id="budgetUsd">-</span>
        </div>
        <div class="stat-row" id="remainingRow" style="display:none">
          <span class="stat-label">Remaining</span>
          <span class="stat-value" id="remainingUsd">-</span>
        </div>
      </div>
    </div>

    <div class="side-section">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>Token Chart</h3>
        <span class="section-arrow">&#9660;</span>
      </div>
      <div class="section-body" id="chartBody">
        <canvas id="tokenChart"></canvas>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </div>

    <div class="side-section">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>Stats</h3>
        <span class="section-arrow collapsed">&#9660;</span>
      </div>
      <div class="section-body hidden">
        <div class="stat-row">
          <span class="stat-label">Subagents</span>
          <span class="stat-value" id="subagents">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Compactions</span>
          <span class="stat-value" id="compactions">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Tools</span>
          <span class="stat-value" id="toolCount">0</span>
        </div>
        <div class="tool-list" id="toolList"></div>
      </div>
    </div>

    <div class="side-section">
      <h3>Controls</h3>
      <div class="controls">
        <button class="ctrl-btn danger" id="btnStop" onclick="doStop()">Stop</button>
      </div>
    </div>

    <div class="side-section">
      <h3>Steering</h3>
      <textarea class="steer-textarea" id="steerInput" placeholder="Enter steering prompt..."></textarea>
      <div class="steer-actions">
        <span class="steer-hint">Ctrl+Enter to send</span>
        <button class="ctrl-btn primary" style="flex:0;padding:6px 16px" onclick="doSteer()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="conn-status">
    <span class="conn-dot" id="connDot"></span>
    <span id="connText">Connected</span>
  </div>
  <span id="eventCount">0 events</span>
</div>

<script>
(function() {
  const MAX_LOG_ENTRIES = 2000;
  let eventCount = 0;
  let autoScroll = true;
  let currentFilter = 'all';
  let startTime = null;
  let elapsedTimer = null;
  let toolCalls = {};

  const logContainer = document.getElementById('logContainer');
  const jumpBtn = document.getElementById('jumpBtn');
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');

  // Auto-scroll tracking
  logContainer.addEventListener('scroll', function() {
    const { scrollTop, scrollHeight, clientHeight } = logContainer;
    const atBottom = scrollHeight - scrollTop - clientHeight < 40;
    autoScroll = atBottom;
    jumpBtn.style.display = atBottom ? 'none' : 'block';
  });

  window.jumpToBottom = function() {
    logContainer.scrollTop = logContainer.scrollHeight;
    autoScroll = true;
    jumpBtn.style.display = 'none';
  };

  window.clearLogs = function() {
    logContainer.innerHTML = '';
    autoScroll = true;
    jumpBtn.style.display = 'none';
  };

  function addLogEntry(entry) {
    const div = document.createElement('div');
    div.className = `log-entry level-${entry.level}`;
    div.dataset.level = entry.level;
    div.innerHTML =
      `<span class="ts">[${entry.ts}]</span>` +
      `<span class="iter">[${entry.iteration}]</span> ` +
      `<span class="prefix">${escapeHtml(entry.prefix)}</span> ` +
      escapeHtml(entry.msg);

    if (currentFilter !== 'all' && entry.level !== currentFilter) {
      div.style.display = 'none';
    }

    logContainer.appendChild(div);

    // Prune old entries
    while (logContainer.children.length > MAX_LOG_ENTRIES) {
      logContainer.removeChild(logContainer.firstChild);
    }

    if (autoScroll) {
      logContainer.scrollTop = logContainer.scrollHeight;
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatNum(n) {
    return n.toLocaleString();
  }

  function updateState(state) {
    const badge = document.getElementById('stateBadge');
    const text = document.getElementById('stateText');
    badge.className = `state-badge state-${state}`;
    text.textContent = state;

    const btnStop = document.getElementById('btnStop');
    btnStop.disabled = state === 'stopped' || state === 'stopping' || state === 'idle';

    if (state === 'running' && !elapsedTimer) {
      if (!startTime) startTime = Date.now();
      elapsedTimer = setInterval(updateElapsed, 1000);
    }
    if (state === 'stopped' || state === 'idle') {
      if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    }
  }

  function updateElapsed() {
    if (!startTime) return;
    const ms = Date.now() - startTime;
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    document.getElementById('elapsed').textContent =
      [h, m, sec].map(n => n.toString().padStart(2, '0')).join(':');
  }

  function updateStats(stats) {
    if (stats.startTime && !startTime) startTime = stats.startTime;

    document.getElementById('tokInput').textContent = formatNum(stats.tokens.inputTokens);
    document.getElementById('tokOutput').textContent = formatNum(stats.tokens.outputTokens);
    document.getElementById('tokTotal').textContent = formatNum(
      stats.tokens.inputTokens + stats.tokens.outputTokens
    );
    document.getElementById('costUsd').textContent = '$' + (stats.costUsd || 0).toFixed(4);
    document.getElementById('subagents').textContent = stats.subagentsSpawned;
    document.getElementById('compactions').textContent = stats.compactions;

    toolCalls = stats.toolCalls || {};
    renderToolList();
    updateBudgetRemaining(stats.costUsd || 0);
  }

  function updateIteration(data) {
    document.getElementById('iterCurrent').textContent = data.current;
    document.getElementById('iterMax').textContent = data.max;
  }

  function renderToolList() {
    const container = document.getElementById('toolList');
    const sorted = Object.entries(toolCalls).sort((a, b) => b[1] - a[1]);
    container.innerHTML = '';
    let total = 0;
    for (const [name, count] of sorted) {
      total += count;
      const tag = document.createElement('span');
      tag.className = 'tool-tag';
      tag.textContent = `${name}(${count})`;
      container.appendChild(tag);
    }
    document.getElementById('toolCount').textContent = total;
  }

  function updateToolFromEvent(data) {
    toolCalls[data.name] = (toolCalls[data.name] || 0) + 1;
    renderToolList();
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      document.querySelectorAll('.log-entry').forEach(entry => {
        if (currentFilter === 'all' || entry.dataset.level === currentFilter) {
          entry.style.display = '';
        } else {
          entry.style.display = 'none';
        }
      });
      if (autoScroll) logContainer.scrollTop = logContainer.scrollHeight;
    });
  });

  // SSE connection
  function connect() {
    const es = new EventSource('/api/events');

    es.addEventListener('log', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      addLogEntry(JSON.parse(e.data));
    });

    es.addEventListener('state', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      updateState(JSON.parse(e.data).state);
    });

    es.addEventListener('stats', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      updateStats(JSON.parse(e.data));
    });

    es.addEventListener('iteration', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      updateIteration(JSON.parse(e.data));
    });

    es.addEventListener('tool', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      updateToolFromEvent(JSON.parse(e.data));
    });

    es.addEventListener('model-change', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      const data = JSON.parse(e.data);
      document.getElementById('modelInput').value = data.model;
    });

    es.addEventListener('steer-ack', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
    });

    es.addEventListener('iteration-summary', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      const summary = JSON.parse(e.data);
      iterationHistory.push(summary);
      renderTokenChart();
    });

    es.addEventListener('iteration-history', function(e) {
      eventCount++;
      document.getElementById('eventCount').textContent = eventCount + ' events';
      iterationHistory = JSON.parse(e.data);
      renderTokenChart();
    });

    es.addEventListener('keepalive', function() {});

    es.onopen = function() {
      connDot.classList.remove('disconnected');
      connText.textContent = 'Connected';
      // Clear waiting message
      if (logContainer.children.length === 1 && logContainer.firstChild.textContent.includes('Waiting')) {
        logContainer.innerHTML = '';
      }
    };

    es.onerror = function() {
      connDot.classList.add('disconnected');
      connText.textContent = 'Reconnecting...';
    };
  }

  // Fetch initial state
  fetch('/api/state')
    .then(r => r.json())
    .then(data => {
      updateState(data.state);
      updateIteration(data.iteration);
      updateStats(data.stats);
      if (data.config?.model) {
        document.getElementById('modelInput').value = data.config.model;
      }
      if (data.config?.maxCostUsd != null) {
        showBudget(data.config.maxCostUsd);
        updateBudgetRemaining(data.stats?.costUsd || 0);
      }
      if (data.iterationHistory && data.iterationHistory.length > 0) {
        iterationHistory = data.iterationHistory;
        renderTokenChart();
      }
    })
    .catch(() => {});

  connect();

  // Controls
  window.doStop = function() {
    if (confirm('Stop the loop?')) {
      fetch('/api/stop', { method: 'POST' }).catch(() => {});
    }
  };

  // Model change
  window.doModelChange = function() {
    const input = document.getElementById('modelInput');
    const model = input.value.trim();
    if (!model) return;

    fetch('/api/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model })
    })
    .then(r => r.json())
    .catch(() => {});
  };

  window.setModel = function(model) {
    document.getElementById('modelInput').value = model;
    window.doModelChange();
  };

  document.getElementById('modelInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      window.doModelChange();
    }
  });

  // Steering
  window.doSteer = function() {
    const textarea = document.getElementById('steerInput');
    const prompt = textarea.value.trim();
    if (!prompt) return;

    fetch('/api/steer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    })
    .then(r => r.json())
    .then(data => {
      if (data.ok) textarea.value = '';
    })
    .catch(() => {});
  };

  document.getElementById('steerInput').addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      window.doSteer();
    }
  });

  // ─── Sidebar toggle (responsive) ───────────────────────────────────────────
  window.toggleSidebar = function() {
    document.querySelector('.side-panel').classList.toggle('visible');
  };

  // ─── Budget display ────────────────────────────────────────────────────────
  let maxCostUsd = null;

  function showBudget(budget) {
    if (budget == null) return;
    maxCostUsd = budget;
    document.getElementById('budgetRow').style.display = '';
    document.getElementById('remainingRow').style.display = '';
    document.getElementById('budgetUsd').textContent = '$' + budget.toFixed(2);
  }

  function updateBudgetRemaining(cost) {
    if (maxCostUsd == null) return;
    const remaining = Math.max(0, maxCostUsd - cost);
    const el = document.getElementById('remainingUsd');
    el.textContent = '$' + remaining.toFixed(4);
    el.classList.remove('budget-warn', 'budget-danger');
    const pct = remaining / maxCostUsd;
    if (pct < 0.10) el.classList.add('budget-danger');
    else if (pct < 0.25) el.classList.add('budget-warn');
  }

  // ─── Token Chart ───────────────────────────────────────────────────────────
  let iterationHistory = [];
  const canvas = document.getElementById('tokenChart');
  const ctx = canvas.getContext('2d');
  const tooltip = document.getElementById('chartTooltip');

  function compactLabel(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K';
    return n.toString();
  }

  function renderTokenChart() {
    if (iterationHistory.length === 0) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const W = rect.width, H = rect.height;
    const pad = { top: 24, right: 10, bottom: 24, left: 40 };
    const chartW = W - pad.left - pad.right;
    const chartH = H - pad.top - pad.bottom;

    ctx.clearRect(0, 0, W, H);

    // Compute max
    let maxVal = 0;
    for (const d of iterationHistory) {
      const total = d.inputTokens + d.outputTokens;
      if (total > maxVal) maxVal = total;
    }
    if (maxVal === 0) maxVal = 1;
    // Round up for nice axis
    const mag = Math.pow(10, Math.floor(Math.log10(maxVal)));
    maxVal = Math.ceil(maxVal / mag) * mag;

    const barCount = iterationHistory.length;
    const barW = Math.max(4, Math.min(30, (chartW - barCount * 2) / barCount));
    const gap = Math.max(1, (chartW - barW * barCount) / (barCount + 1));

    // Y axis gridlines + labels
    ctx.strokeStyle = 'rgba(48,54,61,0.6)';
    ctx.fillStyle = '#8b949e';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    const ticks = 4;
    for (let t = 0; t <= ticks; t++) {
      const val = (maxVal / ticks) * t;
      const y = pad.top + chartH - (val / maxVal) * chartH;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(W - pad.right, y);
      ctx.stroke();
      ctx.fillText(compactLabel(Math.round(val)), pad.left - 4, y + 3);
    }

    // Bars
    for (let i = 0; i < barCount; i++) {
      const d = iterationHistory[i];
      const x = pad.left + gap + i * (barW + gap);
      const inputH = (d.inputTokens / maxVal) * chartH;
      const outputH = (d.outputTokens / maxVal) * chartH;

      // Input (purple) — bottom
      ctx.fillStyle = '#bc8cff';
      ctx.fillRect(x, pad.top + chartH - inputH - outputH, barW, inputH);

      // Output (blue) — top
      ctx.fillStyle = '#58a6ff';
      ctx.fillRect(x, pad.top + chartH - outputH, barW, outputH);

      // X label
      ctx.fillStyle = '#8b949e';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(d.iteration.toString(), x + barW / 2, H - pad.bottom + 14);
    }

    // Legend
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#bc8cff';
    ctx.fillRect(pad.left + 2, 4, 10, 10);
    ctx.fillStyle = '#c9d1d9';
    ctx.fillText('Input', pad.left + 16, 13);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(pad.left + 60, 4, 10, 10);
    ctx.fillStyle = '#c9d1d9';
    ctx.fillText('Output', pad.left + 74, 13);
  }

  // Tooltip on hover
  canvas.addEventListener('mousemove', function(e) {
    if (iterationHistory.length === 0) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const W = rect.width;
    const pad = { top: 24, right: 10, bottom: 24, left: 40 };
    const chartW = W - pad.left - pad.right;
    const barCount = iterationHistory.length;
    const barW = Math.max(4, Math.min(30, (chartW - barCount * 2) / barCount));
    const gap = Math.max(1, (chartW - barW * barCount) / (barCount + 1));

    let idx = -1;
    for (let i = 0; i < barCount; i++) {
      const x = pad.left + gap + i * (barW + gap);
      if (mx >= x && mx <= x + barW) { idx = i; break; }
    }

    if (idx >= 0) {
      const d = iterationHistory[idx];
      tooltip.innerHTML =
        `<b>Iteration ${d.iteration}</b><br>` +
        `Input: ${formatNum(d.inputTokens)}<br>` +
        `Output: ${formatNum(d.outputTokens)}<br>` +
        `Cost: $${d.cost.toFixed(4)}`;
      tooltip.style.display = 'block';
      // Position tooltip relative to side-panel
      const sp = canvas.closest('.side-section').getBoundingClientRect();
      tooltip.style.left = (e.clientX - sp.left + 12) + 'px';
      tooltip.style.top = (e.clientY - sp.top - 30) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  });

  canvas.addEventListener('mouseleave', function() {
    tooltip.style.display = 'none';
  });

  // Generic section toggle
  window.toggleSection = function(headerEl) {
    const body = headerEl.nextElementSibling;
    const arrow = headerEl.querySelector('.section-arrow');
    body.classList.toggle('hidden');
    if (arrow) arrow.classList.toggle('collapsed');
    // Re-render chart if its section was just opened
    if (body.id === 'chartBody' && !body.classList.contains('hidden')) renderTokenChart();
  };

  // ─── Panel resize drag ─────────────────────────────────────────────────────
  (function() {
    const handle = document.getElementById('resizeHandle');
    const panel = document.getElementById('sidePanel');
    let dragging = false;

    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      handle.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      const containerRight = document.querySelector('.main').getBoundingClientRect().right;
      const newWidth = Math.max(200, Math.min(600, containerRight - e.clientX));
      panel.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      // Re-render chart after resize
      if (!document.getElementById('chartBody').classList.contains('hidden')) {
        renderTokenChart();
      }
    });
  })();

  // Resize handler
  window.addEventListener('resize', function() {
    if (!document.getElementById('chartBody').classList.contains('hidden')) {
      renderTokenChart();
    }
  });
})();
</script>
</body>
</html>
